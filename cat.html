        document.querySelectorAll('.reveal').forEach((el) => el.classList.add('in'));
      } else if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });
        document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
      } else {
        document.querySelectorAll('.reveal').forEach((el) => el.classList.add('in'));
      }
    })();
  </script>
  <script>
    'use strict';
    document.addEventListener('DOMContentLoaded', () => {
      const stars = document.querySelectorAll('.star');
      const ratingText = document.getElementById('ratingText');
      const resetBtn = document.getElementById('resetBtn');
      const cat = document.getElementById('cat');
      const heartsContainer = document.querySelector('.hearts');
      const sparklesContainer = document.querySelector('.sparkles');
      let currentRating = 0;

      const messages = {
        1: '😿 Poor — we\'ll do much better next time',
        2: '😾 Fair — there\'s room for improvement',
        3: '😸 Good — thanks for your feedback!',
        4: '😺 Great — we\'re happy you enjoyed it',
        5: '😻 Excellent — you made our day!'
      };

      const updateStars = (rating) => {
        stars.forEach((star, index) => {
          if (index < rating) {
            star.classList.add('active');
            star.setAttribute('aria-checked', 'true');
          } else {
            star.classList.remove('active');
            star.setAttribute('aria-checked', 'false');
          }
        });
      };

      const updateCatEmotion = (rating) => {
        cat.classList.remove('sad', 'happy', 'excited');
        if (rating === 0) return;
        if (rating <= 2) cat.classList.add('sad');
        else if (rating <= 4) cat.classList.add('happy');
        else cat.classList.add('excited');
      };

      const createHearts = () => {
        const emojis = ['💕', '💖', '💗', '💝', '💘'];
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            heart.style.left = (Math.random() * 60 + 10) + 'px';
            heart.style.animationDelay = Math.random() * 0.3 + 's';
            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
          }, i * 100);
        }
      };

      const createBurst = () => {
        for (let i = 0; i < 10; i++) {
          setTimeout(() => {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 0.2 + 's';
            sparklesContainer.appendChild(s);
            setTimeout(() => s.remove(), 1500);
          }, i * 50);
        }
      };

      const rate = (rating) => {
        currentRating = rating;
        updateStars(rating);
        ratingText.textContent = messages[rating];
        ratingText.classList.add('show');
        updateCatEmotion(rating);
        resetBtn.classList.add('show');
        if (rating === 5) { createHearts(); createBurst(); }
      };

      stars.forEach((star) => {
        star.addEventListener('click', () => rate(Number(star.dataset.rating)));
        star.addEventListener('mouseenter', () => {
          if (currentRating === 0) updateStars(Number(star.dataset.rating));
        });
        star.addEventListener('focus', () => {
          if (currentRating === 0) updateStars(Number(star.dataset.rating));
        });
      });

      document.querySelector('.stars').addEventListener('mouseleave', () => {
        if (currentRating === 0) updateStars(0);
      });

      resetBtn.addEventListener('click', () => {
        currentRating = 0;
        updateStars(0);
        updateCatEmotion(0);
        ratingText.classList.remove('show');
        resetBtn.classList.remove('show');
        heartsContainer.innerHTML = '';
      });

      setInterval(() => {
        if (Math.random() < 0.2) {
          const s = document.createElement('div');
          s.className = 'sparkle';
          s.style.left = Math.random() * 100 + '%';
          s.style.top = Math.random() * 100 + '%';
          s.style.opacity = '0.3';
          sparklesContainer.appendChild(s);
          setTimeout(() => s.remove(), 1500);
        }
      }, 2000);
    });
  </script>
</body>
</html>
