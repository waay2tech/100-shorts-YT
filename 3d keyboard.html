    .keypad {
      position: relative;
      aspect-ratio: 400 / 310;
      display: flex;
      place-items: center;
      width: clamp(280px, 45vw, 500px);
      margin-inline: auto;
      -webkit-tap-highlight-color: #0000;
      transition-property: translate, transform;
      transition-duration: 0.1s;
      transition-timing-function: ease-out;
      transform-style: preserve-3d;
      scale: 1;
      perspective: 1000px;
      transform-origin: center center;
    }

    .key {
      transform-style: preserve-3d;
      border: 0;
      background: #0000;
      padding: 0;
      cursor: pointer;
      outline: none;
    }

    .key[data-pressed='true'] .key__content,
    .key:active .key__content {
      translate: 0 calc(var(--travel) * 1%);

    .sr-only {

    lt = null;

  <script>
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.querySelectorAll('[data-year]').forEach(function (el) { el.textContent = new Date().getFullYear(); });
      var reveals = document.querySelectorAll('.reveal');
      if ('IntersectionObserver' in window && !reduce) {
        var io = new IntersectionObserver(function (entries, obs) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); }
          });
        }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
        reveals.forEach(function (el) { io.observe(el); });
      } else {
        reveals.forEach(function (el) { el.classList.add('in'); });
      }
    })();
  </script>
  <script>
    'use strict';

    const config = {
      platform: 'gemini',
      muted: false,
      one: { travel: 26, key: 'Meta', hue: 330, saturation: 0.4, brightness: 1.4, buttonElement: document.querySelector('#one') },
      two: { travel: 26, key: 'Tab', hue: 0, saturation: 0, brightness: 1.4, buttonElement: document.querySelector('#two') },
      three: { travel: 18, key: 'c', hue: 0, saturation: 0, brightness: 0.4, buttonElement: document.querySelector('#three') },
      four: { travel: 18, key: 'v', hue: 0, saturation: 0, brightness: 0.4, buttonElement: document.querySelector('#four') },
      five: { travel: 18, key: 'Escape', hue: 0, saturation: 0, brightness: 0.4, buttonElement: document.querySelector('#five') }
    };

    const clickAudio = new Audio('https://cdn.freesound.org/previews/378/378085_6260145-lq.mp3');
    clickAudio.muted = config.muted;

    const ids = ['one', 'two', 'three', 'four', 'five'];
    const keypad = document.querySelector('.keypad');

    const playKey = () => {
      if (config.muted) return;
      clickAudio.currentTime = 0;
      clickAudio.play();
    };

    ids.forEach((id) => {
      const key = config[id];
      key.buttonElement.style.setProperty('--travel', key.travel);
      key.buttonElement.style.setProperty('--saturate', key.saturation);
      key.buttonElement.style.setProperty('--hue', key.hue);
      key.buttonElement.style.setProperty('--brightness', key.brightness);

      key.buttonElement.addEventListener('pointerdown', () => {
        playKey();
        const currentTransform = keypad.style.transform;
        keypad.style.transform = currentTransform + ' scale(0.98)';
        setTimeout(() => {
          keypad.style.transform = currentTransform;
        }, 150);
      });
    });

    window.addEventListener('keydown', (event) => {
      ids.forEach((id) => {
        if (event.key === config[id].key) {
          config[id].buttonElement.dataset.pressed = true;
          playKey();
        }
      });
    });

    window.addEventListener('keyup', (event) => {
      ids.forEach((id) => {
        if (event.key === config[id].key || event.key === 'Meta') {
          config[id].buttonElement.dataset.pressed = false;
        }
      });
    });

    document.body.dataset.platform = config.platform;

    document.querySelectorAll('.platform-chip').forEach((chip) => {
      const activate = () => {
        document.querySelectorAll('.platform-chip').forEach((c) => {
          c.classList.remove('active');
          c.setAttribute('aria-pressed', 'false');
        });
        chip.classList.add('active');
        chip.setAttribute('aria-pressed', 'true');
        document.body.dataset.platform = chip.dataset.platformToggle;
      };

      chip.addEventListener('click', activate);
      chip.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          activate();
        }
      });
    });

    let mouseTimeout;

    const centerKeypad = () => {
      keypad.style.transform = 'perspective(2000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
    };

    function handleMouseMove(event) {
      const rect = keypad.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const rotateX = ((event.clientY - centerY) / window.innerHeight) * -30;
      const rotateY = ((event.clientX - centerX) / window.innerWidth) * 30;

      keypad.style.transform = `perspective(2000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(50px)`;

      clearTimeout(mouseTimeout);
      mouseTimeout = setTimeout(centerKeypad, 2000);
    }

    document.addEventListener('pointermove', handleMouseMove, { passive: true });
    document.addEventListener('pointerleave', centerKeypad);
  </script>
